<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roblox English — Pronouns & Basics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #14152b;
    --bg-2: #1d1e3d;
    --panel: #23244a;
    --panel-line: #363870;
    --ink: #f2f1ff;
    --muted: #a8a9d6;
    --brick: #ff3a5e;
    --brick-dark: #c5203e;
    --lime: #4ee08a;
    --lime-dark: #2fb96b;
    --gold: #ffc93c;
    --sky: #4ea1ff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: radial-gradient(circle at 20% 0%, var(--bg-2), var(--bg-1) 60%);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    min-height: 100%;
    display: flex;
    justify-content: center;
    padding: 28px 16px 48px;
  }
  .stage {
    width: 100%;
    max-width: 480px;
  }
  .hero {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
  }
  .hero img {
    width: 84px;
    height: auto;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.45));
    flex-shrink: 0;
    image-rendering: -webkit-optimize-contrast;
  }
  .hero h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.5rem;
    line-height: 1.15;
    margin: 0 0 4px;
    color: var(--gold);
  }
  .hero p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .track {
    height: 10px;
    border-radius: 6px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    overflow: hidden;
    margin-bottom: 22px;
  }
  .track-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--lime), var(--sky));
    transition: width .35s ease;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 18px;
    padding: 22px 20px;
    box-shadow: 0 10px 26px rgba(0,0,0,.35);
  }
  .qnum {
    font-family: 'Baloo 2', sans-serif;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 6px;
  }
  .qtext {
    font-size: 1.12rem;
    line-height: 1.4;
    margin-bottom: 18px;
  }
  .qtext .blank {
    display: inline-block;
    min-width: 46px;
    border-bottom: 3px solid var(--gold);
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .opt {
    font-family: 'Nunito', sans-serif;
    font-size: 1.02rem;
    font-weight: 700;
    text-align: left;
    color: var(--ink);
    background: var(--bg-2);
    border: 2px solid var(--panel-line);
    border-radius: 12px;
    padding: 13px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .opt:hover:not(:disabled) { border-color: var(--sky); }
  .opt:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .opt .tag {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .opt:disabled { cursor: default; }
  .opt.correct { background: rgba(78,224,138,.16); border-color: var(--lime); }
  .opt.correct .tag { background: var(--lime); color: #0c2318; }
  .opt.wrong { background: rgba(255,58,94,.14); border-color: var(--brick); }
  .opt.wrong .tag { background: var(--brick); color: #2a0007; }
  .feedback {
    margin-top: 14px;
    font-weight: 700;
    font-size: 0.95rem;
    min-height: 1.2em;
  }
  .feedback.ok { color: var(--lime); }
  .feedback.no { color: var(--brick); }
  .next {
    margin-top: 18px;
    width: 100%;
    font-family: 'Baloo 2', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: #14152b;
    background: var(--gold);
    border: none;
    border-radius: 12px;
    padding: 13px;
    cursor: pointer;
    display: none;
  }
  .next:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .challenge-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 6px; }
  .challenge-row { display: flex; align-items: center; gap: 8px; font-size: 1.02rem; flex-wrap: wrap; }
  .challenge-row input {
    flex: 1;
    min-width: 90px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    background: var(--bg-2);
    border: 2px solid var(--panel-line);
    border-radius: 10px;
    color: var(--ink);
    padding: 9px 12px;
  }
  .challenge-row input:focus-visible { outline: 3px solid var(--sky); outline-offset: 1px; border-color: var(--sky); }
  .reveal-btn {
    margin-top: 8px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--panel-line);
    border-radius: 12px;
    padding: 11px;
    width: 100%;
    cursor: pointer;
  }
  .examples {
    display: none;
    margin-top: 14px;
    background: var(--bg-2);
    border: 1px dashed var(--panel-line);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.6;
  }

  .result {
    display: none;
    text-align: center;
  }
  .result img { width: 120px; margin: 0 auto 14px; filter: drop-shadow(0 8px 16px rgba(0,0,0,.4)); }
  .result h2 {
    font-family: 'Baloo 2', sans-serif;
    color: var(--gold);
    margin: 0 0 6px;
  }
  .score {
    font-size: 2.2rem;
    font-weight: 800;
    font-family: 'Baloo 2', sans-serif;
    color: var(--lime);
    margin: 4px 0 10px;
  }
  .result p { color: var(--muted); margin: 0 0 18px; }
  .retry {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    color: #14152b;
    background: var(--lime);
    border: none;
    border-radius: 12px;
    padding: 13px 22px;
    cursor: pointer;
    font-size: 1rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .track-fill { transition: none; }
  }
</style>
</head>

  { emoji:"🎮", context:"Complete the sentence: your friend is playing Roblox.", sentence:"“___ is playing Roblox.”", options:["He","I","We"], correct:0 },
  { emoji:"🐶", context:"Adopt Me! You have a pet.", sentence:"“___ is my dog.”", options:["He","It","We"], correct:1 },
  { emoji:"🎮", context:"You are talking to your friend:", sentence:"“___ are my best friend!”", options:["You","He","It"], correct:0 },
];

const CHALLENGE = [
  { lead: "I am", example: "ready to play" },
  { lead: "You are", example: "my best friend" },
  { lead: "He is", example: "playing Roblox" },
  { lead: "She is", example: "in Brookhaven" },
  { lead: "We are", example: "crewmates" },
  { lead: "They are", example: "scary monsters" },
];

let current = 0;
let score = 0;
let answered = false;

const qnum = document.getElementById('qnum');
const qtext = document.getElementById('qtext');
const optionsEl = document.getElementById('options');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const trackFill = document.getElementById('trackFill');
const quizCard = document.getElementById('quizCard');
const resultCard = document.getElementById('resultCard');

function renderQuestion() {
  answered = false;
  feedback.textContent = '';
  feedback.className = 'feedback';
  nextBtn.style.display = 'none';
  trackFill.style.width = ((current) / (QUESTIONS.length + 1) * 100) + '%';

  const q = QUESTIONS[current];
  qnum.textContent = `Pregunta ${current + 1} de ${QUESTIONS.length + 1}`;
  qtext.innerHTML = `<span style="opacity:.8">${q.emoji} ${q.context}</span><br><br><strong>${q.sentence.replace('___', '<span class="blank">&nbsp;</span>')}</strong>`;

  optionsEl.innerHTML = '';
  const letters = ['A','B','C'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="tag">${letters[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(i, btn));
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(i, btn) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[current];
  const buttons = optionsEl.querySelectorAll('.opt');
  buttons.forEach(b => b.disabled = true);

  if (i === q.correct) {
    score++;
    btn.classList.add('correct');
    feedback.textContent = '¡Correcto! 🎉';
    feedback.className = 'feedback ok';
  } else {
    btn.classList.add('wrong');
    buttons[q.correct].classList.add('correct');
    feedback.textContent = 'Casi. La respuesta correcta está en verde.';
    feedback.className = 'feedback no';
  }
  nextBtn.style.display = 'block';
  nextBtn.textContent = (current === QUESTIONS.length - 1) ? 'Ir al reto final →' : 'Siguiente →';
}

function goNext() {
  current++;
  if (current < QUESTIONS.length) {
    renderQuestion();
  } else {
    renderChallenge();
  }
}
nextBtn.onclick = goNext;

function renderChallenge() {
  trackFill.style.width = (QUESTIONS.length / (QUESTIONS.length + 1) * 100) + '%';
  qnum.textContent = `Reto final`;
  qtext.innerHTML = `🏆 <strong>Mini challenge</strong> — completa cada frase con tus propias palabras.`;
  optionsEl.innerHTML = '';

  const list = document.createElement('div');
  list.className = 'challenge-list';
  CHALLENGE.forEach((c, idx) => {
    const row = document.createElement('div');
    row.className = 'challenge-row';
    row.innerHTML = `<strong>${c.lead}</strong> <input type="text" placeholder="______" data-idx="${idx}">`;
    list.appendChild(row);
  });
  optionsEl.appendChild(list);

  const revealBtn = document.createElement('button');
  revealBtn.className = 'reveal-btn';
  revealBtn.textContent = 'Ver ejemplos';
  const examples = document.createElement('div');
  examples.className = 'examples';
  examples.innerHTML = CHALLENGE.map(c => `${c.lead} <em>${c.example}</em>.`).join('<br>');
  revealBtn.addEventListener('click', () => {
    examples.style.display = examples.style.display === 'block' ? 'none' : 'block';
  });
  optionsEl.appendChild(revealBtn);
  optionsEl.appendChild(examples);

  feedback.textContent = '';
  nextBtn.style.display = 'block';
  nextBtn.textContent = 'Terminar →';
  nextBtn.onclick = showResult;
}

function showResult() {
  trackFill.style.width = '100%';
  quizCard.style.display = 'none';
  resultCard.style.display = 'block';
  document.getElementById('scoreText').textContent = `${score} / ${QUESTIONS.length}`;
  const msg = document.getElementById('scoreMsg');
  if (score === QUESTIONS.length) msg.textContent = '¡Perfecto! Dominas los pronombres. 🏆';
  else if (score >= QUESTIONS.length - 2) msg.textContent = '¡Muy bien! Solo repasa un par de preguntas.';
  else msg.textContent = 'Buen intento — juega de nuevo para mejorar tu puntaje.';
}

document.getElementById('retryBtn').addEventListener('click', () => {
  current = 0;
  score = 0;
  resultCard.style.display = 'none';
  quizCard.style.display = 'block';
  nextBtn.onclick = goNext;
  renderQuestion();
});

renderQuestion();
</script>
</body>
</html>
